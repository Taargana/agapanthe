# Contenu-3b — a falling cube-cluster of 20 helmet bodies (physics). The `[physics]` block wires the
# engine PhysicsSystem — a `drop` scene is always a physics scene now (the AGAPANTHE_PHYSICS=1 opt-in is gone).

name = "drop"
ambient = [0.08, 0.08, 0.09]

[[cluster]]
prefab = "helmet"
count = 20
inverse_mass = 1.0
restitution = 0.3

[physics]
gravity = [0.0, -9.81, 0.0]
ground_y = 0.0

[[light]]
kind = "directional"
direction = [0.4, -0.7, -0.6]
color = [1.0, 0.96, 0.9]
intensity = 12.0

[camera]
mode = "frame-bounds"
view_dir = [0.0, 0.35, 1.0]
distance_mul = 1.5
fov_y = 60.0
free_fly = true

[environment]
hdri = "models/studio_small_1k.hdr"
