# Contenu-3b — a 10×10 grid of helmets (the culling-sensitive capture gate). The cooker unrolls the
# directive into 100 flat entities.

name = "grid"
ambient = [0.08, 0.08, 0.09]

[[grid]]
prefab = "helmet"
rows = 10
cols = 10
spacing_mul = 1.5

[[light]]
kind = "directional"
direction = [0.4, -0.7, -0.6]
color = [1.0, 0.96, 0.9]
intensity = 12.0

[camera]
mode = "frame-bounds"
view_dir = [0.0, 0.35, 1.0]
distance_mul = 1.5
fov_y = 60.0
free_fly = true

[environment]
hdri = "models/studio_small_1k.hdr"
