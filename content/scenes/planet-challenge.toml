# Contenu-3c-2 — the VS-3 landing-challenge scene (AGAPANTHE_SCENE=planet-challenge). Planet/sun/lighting/
# environment/physics identical to planet.toml/planet-drop.toml (see planet.toml's header comment for how
# those numbers were derived). Beacon/target/camera numbers baked via a throwaway script reproducing
# Sandbox.PlanetContent.SetupPlanetChallenge + Sandbox.SandboxCameras.FramePlanetChallengeCamera's exact
# formulas at their env-var defaults (AGAPANTHE_TARGET_DIST=500, AGAPANTHE_TARGET_DIR=0,
# AGAPANTHE_TARGET_MARKER_HEIGHT=40, AGAPANTHE_CHALLENGE_CAM_ALT=120, AGAPANTHE_CHALLENGE_N=3,
# AGAPANTHE_CHALLENGE_SHOTS=6). Land 3 probes in <= 6 shots; B drops (aimed radial below the camera), F5
# quicksaves to challenge.save.
name = "planet-challenge"
ambient = [0.0, 0.0, 0.0]

[[entity]]
